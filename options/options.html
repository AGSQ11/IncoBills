<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">IncoBills Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <img src="../icons/icon-48.svg" alt="" class="page-logo">
      <div>
        <h1>IncoBills</h1>
        <p class="subtitle" data-i18n="optionsSubtitle"></p>
      </div>
    </header>

    <div id="backendBanner" class="banner banner-warn" role="status" hidden></div>

    <!-- ========== AI Backend ========== -->
    <section class="card">
      <h2 data-i18n="secBackend"></h2>
      <p class="card-desc" data-i18n="secBackendDesc"></p>

      <div class="backend-options">
        <div class="radio-card" data-radio="claude">
          <input type="radio" name="aiBackend" value="claude" id="radioClaude">
          <label for="radioClaude" class="radio-card-body">
            <div class="radio-card-title"><span data-i18n="backendClaude"></span> <span class="badge badge-rec" data-i18n="badgeRecommended"></span></div>
            <p data-i18n="backendClaudeDesc"></p>
          </label>
          <div class="field-group backend-field" data-backend="claude">
            <label for="claudeApiUrl" data-i18n="lblApiUrl"></label>
            <input type="text" id="claudeApiUrl" placeholder="https://api.anthropic.com">
            <label for="claudeApiKey" data-i18n="lblApiKey"></label>
            <div class="input-row">
              <input type="password" id="claudeApiKey" placeholder="sk-ant-..." autocomplete="off">
              <button class="btn btn-sm" id="testClaude" data-i18n="btnTest"></button>
            </div>
            <label for="claudeModel" data-i18n="lblModelClassify"></label>
            <input type="text" id="claudeModel" placeholder="claude-haiku-5-5">
            <label for="claudeExtractModel" data-i18n="lblModelExtract"></label>
            <input type="text" id="claudeExtractModel" placeholder="claude-sonnet-5-5">
          </div>
        </div>

        <div class="radio-card" data-radio="openai">
          <input type="radio" name="aiBackend" value="openai" id="radioOpenai">
          <label for="radioOpenai" class="radio-card-body">
            <div class="radio-card-title" data-i18n="backendOpenai"></div>
            <p data-i18n="backendOpenaiDesc"></p>
          </label>
          <div class="field-group backend-field" data-backend="openai">
            <label for="openaiApiUrl" data-i18n="lblApiUrl"></label>
            <input type="text" id="openaiApiUrl" placeholder="https://api.openai.com">
            <label for="openaiApiKey" data-i18n="lblApiKey"></label>
            <div class="input-row">
              <input type="password" id="openaiApiKey" placeholder="sk-..." autocomplete="off">
              <button class="btn btn-sm" id="testOpenai" data-i18n="btnTest"></button>
            </div>
            <label for="openaiModel" data-i18n="lblModelClassify"></label>
            <input type="text" id="openaiModel" placeholder="gpt-6-luna">
            <label for="openaiExtractModel" data-i18n="lblModelExtract"></label>
            <input type="text" id="openaiExtractModel" placeholder="gpt-6-luna">
          </div>
        </div>

        <div class="radio-card" data-radio="ollama">
          <input type="radio" name="aiBackend" value="ollama" id="radioOllama">
          <label for="radioOllama" class="radio-card-body">
            <div class="radio-card-title"><span data-i18n="backendOllama"></span> <span class="badge badge-priv" data-i18n="badgePrivate"></span></div>
            <p data-i18n="backendOllamaDesc"></p>
          </label>
          <div class="field-group backend-field" data-backend="ollama">
            <label for="ollamaUrl" data-i18n="lblOllamaUrl"></label>
            <div class="input-row">
              <input type="text" id="ollamaUrl" placeholder="http://127.0.0.1:11434">
              <button class="btn btn-sm" id="testOllama" data-i18n="btnTest"></button>
            </div>
            <label for="ollamaModel" data-i18n="lblModelClassify"></label>
            <input type="text" id="ollamaModel" placeholder="llama3.2:3b">
            <label for="ollamaExtractModel" data-i18n="lblModelExtractOllama"></label>
            <input type="text" id="ollamaExtractModel" data-i18n-placeholder="phSameAsClassify">
            <p class="hint" data-i18n="hintOllamaOrigins"></p>
          </div>
        </div>

        <div class="radio-card" data-radio="keywords">
          <input type="radio" name="aiBackend" value="keywords" id="radioKeywords">
          <label for="radioKeywords" class="radio-card-body">
            <div class="radio-card-title"><span data-i18n="backendKeywords"></span> <span class="badge badge-free" data-i18n="badgeFree"></span></div>
            <p data-i18n="backendKeywordsDesc"></p>
          </label>
        </div>
      </div>
      <p class="hint" data-i18n="hintPrivacy"></p>
    </section>

    <!-- ========== Detection ========== -->
    <section class="card">
      <h2 data-i18n="secDetection"></h2>
      <div class="field-group">
        <label for="confidenceThreshold" data-i18n="lblThreshold"></label>
        <div class="slider-row">
          <input type="range" id="confidenceThreshold" min="0.1" max="1.0" step="0.05" value="0.70">
          <span id="thresholdValue" class="slider-value">0.70</span>
        </div>
        <p class="hint" data-i18n="hintThreshold"></p>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="hybridMode" checked>
        <span data-i18n="lblHybrid"></span>
      </label>
      <p class="hint indent" data-i18n="hintHybrid"></p>
    </section>

    <!-- ========== Folder ========== -->
    <section class="card">
      <h2 data-i18n="secFolder"></h2>
      <div class="field-group">
        <label for="folderName" data-i18n="lblFolderName"></label>
        <input type="text" id="folderName" placeholder="Invoices">
        <p class="hint" data-i18n="hintFolderName"></p>
      </div>
      <div class="field-group">
        <label data-i18n="lblFolderMode"></label>
        <div class="radio-group">
          <label class="radio-inline"><input type="radio" name="folderMode" value="perAccount" checked><span data-i18n="optPerAccount"></span></label>
          <label class="radio-inline"><input type="radio" name="folderMode" value="unified"><span data-i18n="optUnified"></span></label>
        </div>
        <p class="hint" data-i18n="hintFolderMode"></p>
      </div>
      <div class="field-group" id="unifiedAccountGroup" hidden>
        <label for="unifiedAccount" data-i18n="lblUnifiedAccount"></label>
        <select id="unifiedAccount">
          <option value="" data-i18n="optAutoFirstAccount"></option>
        </select>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="allowLocalFoldersFallback">
        <span data-i18n="lblLocalFallback"></span>
      </label>
      <p class="hint indent" data-i18n="hintLocalFallback"></p>
    </section>

    <!-- ========== Behavior ========== -->
    <section class="card">
      <h2 data-i18n="secBehavior"></h2>
      <div class="field-group">
        <label data-i18n="lblAction"></label>
        <div class="radio-group">
          <label class="radio-inline"><input type="radio" name="mailAction" value="move" checked><span data-i18n="optMove"></span></label>
          <label class="radio-inline"><input type="radio" name="mailAction" value="copy"><span data-i18n="optCopy"></span></label>
        </div>
        <p class="hint" data-i18n="hintAction"></p>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="autoMove" checked><span data-i18n="lblAutoMove"></span></label>
      <label class="checkbox-row"><input type="checkbox" id="showNotification" checked><span data-i18n="lblNotify"></span></label>
      <label class="checkbox-row"><input type="checkbox" id="notifyOnly"><span data-i18n="lblNotifyOnly"></span></label>
      <p class="hint" data-i18n="hintContextMenu"></p>
    </section>

    <!-- ========== Accounts ========== -->
    <section class="card">
      <h2 data-i18n="secAccounts"></h2>
      <p class="card-desc" data-i18n="secAccountsDesc"></p>
      <div id="accountsList" class="accounts-list">
        <div class="loading" data-i18n="loading"></div>
      </div>
      <p id="accountsWarning" class="hint hint-warn" data-i18n="warnNoAccounts" hidden></p>
    </section>

    <!-- ========== SAGA Export ========== -->
    <section class="card" id="saga">
      <h2><span data-i18n="secSaga"></span> <span class="badge badge-rec">RO</span></h2>
      <p class="card-desc" data-i18n="secSagaDesc"></p>
      <div id="sagaBackendWarning" class="banner banner-warn" hidden></div>

      <div class="saga-subsection">
        <h3 data-i18n="sagaCompanies"></h3>
        <div id="sagaCompaniesList" class="saga-companies-list"></div>
        <button class="btn btn-sm" id="btnAddCompany" data-i18n="btnAddCompany"></button>
      </div>

      <div id="sagaCompanyForm" class="saga-form" hidden>
        <h4 id="sagaFormTitle"></h4>
        <input type="hidden" id="sagaCompanyId">
        <div class="input-row">
          <div><label for="sagaCompCif" data-i18n="fldCifRequired"></label>
            <div class="input-row tight">
              <input type="text" id="sagaCompCif" placeholder="RO12345678">
              <button class="btn btn-sm" id="btnAnafFill" data-i18n="btnAnafFill"></button>
            </div>
          </div>
          <div><label for="sagaCompName" data-i18n="fldNameRequired"></label><input type="text" id="sagaCompName" placeholder="MyCompany SRL"></div>
        </div>
        <div class="input-row">
          <div><label for="sagaCompRegCom" data-i18n="fldRegCom"></label><input type="text" id="sagaCompRegCom" placeholder="J08/1234/2020"></div>
          <div><label for="sagaCompCapital" data-i18n="fldCapital"></label><input type="text" id="sagaCompCapital" placeholder="200"></div>
        </div>
        <div class="input-row">
          <div><label for="sagaCompCountry" data-i18n="fldCountry"></label><input type="text" id="sagaCompCountry" value="RO"></div>
          <div><label for="sagaCompCounty" data-i18n="fldCounty"></label>
            <select id="sagaCompCounty">
              <option value="B">București</option>
              <option value="AB">Alba</option>
              <option value="AR">Arad</option>
              <option value="AG">Argeș</option>
              <option value="BC">Bacău</option>
              <option value="BH">Bihor</option>
              <option value="BN">Bistrița-Năsăud</option>
              <option value="BT">Botoșani</option>
              <option value="BV">Brașov</option>
              <option value="BR">Brăila</option>
              <option value="BZ">Buzău</option>
              <option value="CS">Caraș-Severin</option>
              <option value="CL">Călărași</option>
              <option value="CJ">Cluj</option>
              <option value="CT">Constanța</option>
              <option value="CV">Covasna</option>
              <option value="DB">Dâmbovița</option>
              <option value="DJ">Dolj</option>
              <option value="GL">Galați</option>
              <option value="GR">Giurgiu</option>
              <option value="GJ">Gorj</option>
              <option value="HR">Harghita</option>
              <option value="HD">Hunedoara</option>
              <option value="IL">Ialomița</option>
              <option value="IS">Iași</option>
              <option value="IF">Ilfov</option>
              <option value="MM">Maramureș</option>
              <option value="MH">Mehedinți</option>
              <option value="MS">Mureș</option>
              <option value="NT">Neamț</option>
              <option value="OT">Olt</option>
              <option value="PH">Prahova</option>
              <option value="SM">Satu Mare</option>
              <option value="SJ">Sălaj</option>
              <option value="SB">Sibiu</option>
              <option value="SV">Suceava</option>
              <option value="TR">Teleorman</option>
              <option value="TM">Timiș</option>
              <option value="TL">Tulcea</option>
              <option value="VS">Vaslui</option>
              <option value="VL">Vâlcea</option>
              <option value="VN">Vrancea</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <div><label for="sagaCompCity" data-i18n="fldCity"></label><input type="text" id="sagaCompCity" placeholder="Brașov"></div>
          <div><label for="sagaCompAddress" data-i18n="fldAddress"></label><input type="text" id="sagaCompAddress" placeholder="Str. Exemplu 1"></div>
        </div>
        <div class="input-row">
          <div><label for="sagaCompBank" data-i18n="fldBank"></label><input type="text" id="sagaCompBank" placeholder="Banca Transilvania"></div>
          <div><label for="sagaCompIban" data-i18n="fldIban"></label><input type="text" id="sagaCompIban" placeholder="RO49AAAA1B31007593840000"></div>
        </div>
        <div class="input-row">
          <div><label for="sagaCompPhone" data-i18n="fldPhone"></label><input type="text" id="sagaCompPhone" placeholder="0712345678"></div>
          <div><label for="sagaCompEmail" data-i18n="fldEmail"></label><input type="email" id="sagaCompEmail" placeholder="contact@firma.ro"></div>
        </div>
        <p id="sagaCompanyError" class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button class="btn btn-sm btn-primary" id="btnSaveCompany" data-i18n="btnSave"></button>
          <button class="btn btn-sm" id="btnCancelCompany" data-i18n="btnCancel"></button>
        </div>
      </div>

      <div class="saga-subsection">
        <h3 data-i18n="sagaSettings"></h3>
        <div class="field-group">
          <label for="sagaExportSubdir" data-i18n="lblExportSubdir"></label>
          <input type="text" id="sagaExportSubdir" placeholder="SAGA-Import">
          <p class="hint" data-i18n="hintExportSubdir"></p>
        </div>
        <label class="checkbox-row"><input type="checkbox" id="sagaAutoExtract"><span data-i18n="lblAutoExtract"></span></label>
        <label class="checkbox-row"><input type="checkbox" id="sagaCloudConsent"><span data-i18n="lblCloudConsent"></span></label>
        <p class="hint indent" data-i18n="hintCloudConsent"></p>
        <label class="checkbox-row"><input type="checkbox" id="sagaAnafLookup"><span data-i18n="lblAnafLookup"></span></label>
        <p class="hint indent" data-i18n="hintAnafLookup"></p>
        <label class="checkbox-row"><input type="checkbox" id="sagaSkipDomestic"><span data-i18n="lblSkipDomestic"></span></label>
        <p class="hint indent" data-i18n="hintSkipDomestic"></p>
      </div>

      <div class="saga-subsection">
        <h3><span data-i18n="sagaQueue"></span> <span id="sagaQueueCount" class="badge">0</span></h3>
        <p class="hint" data-i18n="hintQueue"></p>
        <div class="saga-queue-toolbar">
          <button class="btn btn-sm btn-primary" id="btnSagaExportAll" data-i18n="btnExportReady"></button>
          <button class="btn btn-sm btn-danger" id="btnSagaClearQueue" data-i18n="btnClearQueue"></button>
          <span id="sagaQueueStatus" class="inline-status" role="status"></span>
        </div>
        <div id="sagaQueueList" class="saga-queue-list"></div>
      </div>
    </section>

    <!-- ========== Sender rules ========== -->
    <section class="card">
      <h2 data-i18n="secRules"></h2>
      <p class="card-desc" data-i18n="secRulesDesc"></p>
      <div id="rulesList" class="rules-list"></div>
    </section>

    <!-- ========== Scan ========== -->
    <section class="card">
      <h2 data-i18n="secScan"></h2>
      <p class="card-desc" data-i18n="secScanDesc"></p>
      <div class="field-group">
        <div class="input-row">
          <div><label for="scanFrom" data-i18n="lblFrom"></label><input type="date" id="scanFrom"></div>
          <div><label for="scanTo" data-i18n="lblTo"></label><input type="date" id="scanTo"></div>
          <div><label for="scanAccount" data-i18n="lblAccount"></label>
            <select id="scanAccount"><option value="" data-i18n="optAllMonitored"></option></select>
          </div>
        </div>
        <div class="button-row">
          <button class="btn btn-primary" id="btnScan" data-i18n="btnScan"></button>
          <button class="btn" id="btnCancelScan" data-i18n="btnCancelScan" hidden></button>
          <button class="btn btn-sm" id="btnResetProcessed" data-i18n="btnResetProcessed"></button>
        </div>
        <p class="hint" data-i18n="hintScan"></p>
        <div id="scanProgress" class="scan-progress" hidden>
          <div class="progress-bar"><div class="progress-fill" id="scanFill"></div></div>
          <span id="scanStatus" role="status"></span>
        </div>
      </div>
    </section>

    <!-- ========== History ========== -->
    <section class="card">
      <h2 data-i18n="secHistory"></h2>
      <div class="history-toolbar">
        <button class="btn btn-sm" id="btnExportCSV" data-i18n="btnExportCsv"></button>
        <button class="btn btn-sm btn-danger" id="btnClearHistory" data-i18n="btnClearHistory"></button>
      </div>
      <div class="table-wrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th class="sortable" id="sortDate"></th>
              <th data-i18n="colFrom"></th>
              <th data-i18n="colSubject"></th>
              <th data-i18n="colConfidence"></th>
              <th data-i18n="colSource"></th>
              <th data-i18n="colAction"></th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div class="history-footer">
        <button class="btn btn-sm" id="btnLoadMore" data-i18n="btnLoadMore" hidden></button>
      </div>
    </section>

    <div class="save-bar">
      <span id="saveStatus" class="save-status" role="status"></span>
      <button class="btn btn-primary btn-lg" id="btnSave" data-i18n="btnSaveSettings"></button>
    </div>
  </div>

  <!-- ========== Review dialog ========== -->
  <dialog id="reviewDialog" class="review-dialog">
    <form method="dialog" id="reviewForm">
      <header class="review-header">
        <h3 id="reviewTitle" data-i18n="reviewTitle"></h3>
        <p id="reviewSource" class="hint"></p>
      </header>
      <div id="reviewValidation" class="review-validation"></div>
      <div class="review-grid" id="reviewHeaderFields"></div>
      <div class="review-parties">
        <fieldset>
          <legend data-i18n="reviewSupplier"></legend>
          <div class="review-grid" id="reviewSupplierFields"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="reviewClient"></legend>
          <div class="review-grid" id="reviewClientFields"></div>
        </fieldset>
      </div>
      <h4 data-i18n="reviewLines"></h4>
      <div class="table-wrap">
        <table class="lines-table">
          <thead>
            <tr>
              <th data-i18n="colDescription"></th>
              <th data-i18n="colUnit"></th>
              <th data-i18n="colQty"></th>
              <th data-i18n="colPrice"></th>
              <th data-i18n="colValue"></th>
              <th data-i18n="colVatRate"></th>
              <th data-i18n="colVat"></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="reviewLines"></tbody>
        </table>
      </div>
      <div class="button-row">
        <button type="button" class="btn btn-sm" id="btnAddLine" data-i18n="btnAddLine"></button>
        <button type="button" class="btn btn-sm" id="btnRecalcTotals" data-i18n="btnRecalcTotals"></button>
      </div>
      <footer class="review-footer">
        <span id="reviewStatus" class="inline-status" role="status"></span>
        <button type="button" class="btn" id="btnReviewCancel" data-i18n="btnCancel"></button>
        <button type="button" class="btn" id="btnReviewSave" data-i18n="btnSave"></button>
        <button type="button" class="btn btn-primary" id="btnReviewApprove" data-i18n="btnSaveReviewed"></button>
      </footer>
    </form>
  </dialog>

  <script src="../shared/constants.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
